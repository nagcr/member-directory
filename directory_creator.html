<!--
This is code that writes code. 

This is an html file that has 
the javascript that is used to 
generate the html file that is 
used as the directory. It
seeks an input of a utf-8 csv 
file containing the directory
content. From that file, it 
generates an html file 
containing the directory and 
a javascript utility to search 
it. 

Do not edit this unless you 
know what you are doing. 
-->

<title>Directory Creation Utility</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <center>
        <h1>Directory HTML Creation Utility</h1>
        <div>
			<p>Choose a file with a csv of the directory</p>
            <input type="file">
			<p>Then copy and paste this code to Memberspace.</p>
            <textarea readonly="" cols="60" rows="20" placeholder="Code to paste to memberspace will appear here">            </textarea>
        </div>
    </center>
  
<script type="application/javascript">
let input = document.querySelector('input')
let textarea = document.querySelector('textarea')
// This event listener has been implemented to identify a
// Change in the input section of the html code
// It will be triggered when a file is chosen.
input.addEventListener('change', () => {
	let files = input.files;
	if (files.length == 0) return;
	/* If any further modifications have to be made on the
	Extracted text. The text can be accessed using the
	file variable. But since this is const, it is a read
	only variable, hence immutable. To make any changes,
	changing const to var, here and In the reader.onload
	function would be advisible */
	const file = files[0];
	let reader = new FileReader();
	reader.onload = (e) => {
		const file = e.target.result;
				
		Papa.parse(file, {
			header: true, 
			complete: function(results) {
				// Make some changes to certain listings
				for (let person of results.data) {
					// For USA addresses, change "U.S.A." to "USA"
					if (person.Country == 'U. S. A.') {
						person.Country = "USA";
					}
					// There was a problem with the imported csv file where zip codes with 
					// leadings 0s did not include the leading zeros. This code addes a 
					// leading 0s if the zip code is exactly 3 or 5 digits long
					if (typeof person['Zip Post Code'] !== 'undefined') {
						if (person['Zip Post Code'].length == 3) {
							person['Zip Post Code'] = '00' + person['Zip Post Code'];
						}
						if (person['Zip Post Code'].length == 4) {
							person['Zip Post Code'] = '0' + person['Zip Post Code'];
						}
					}
					// For non-resident life members, remove all contact info except country,
					// because contact info may be out of date
					if (person['Memb Cat for Web Directory'] == "Non-Resident Member") {
						person['Memb Cat for Web Directory'] = "Non-Resident Life Member";
						person.Address1 = "";
						person.Address2 = "";
						person.City = "";
						person['State or Province'] = "";
						person['Zip Post Code'] = "";
						person['Email Address'] = "";
						person['Home Phone'] = "";
						person['Work Phone'] = "";
						person['Cell Phone'] = "";
						person.Fax = "";
						person['Expiry Year'] = "";
						person['Expiry Month'] = "";
					}
					// For inactive members, remove all contact info and designate inactive
					if (person['Activity'] == "I") {
						person['Memb Cat for Web Directory'] = "Former member";
						person.Address1 = "";
						person.Address2 = "";
						person.City = "";
						person['State or Province'] = "";
						person['Country'] = "";
						person['Zip Post Code'] = "";
						person['Email Address'] = "";
						person['Home Phone'] = "";
						person['Work Phone'] = "";
						person['Cell Phone'] = "";
						person.Fax = "";
					}
					// For full members, get rid of the description of the membership type
					if (person['Memb Cat for Web Directory'] == "North American Member") {
						person['Memb Cat for Web Directory'] = "";
					}
					// Remove people who have opted out of the online directory
					if (person['Opt Out Online List'] == 'Yes') {
						person.Address1 = 'Withheld at request of member';
						person.Address2 = "";
						person.City = "";
						person['State or Province'] = "";
						person['Zip Post Code'] = "";
						person.Country = "";
						person['Email Address'] = "";
						person['Home Phone'] = "";
						person['Work Phone'] = "";
						person['Cell Phone'] = "";
						person.Fax = "";
					}
				}
				var json_output = JSON.stringify(results.data);
				final_code = html_pre_json + json_output + html_post_json;
				textarea.value = final_code;
			}
		});
	};
	
	reader.onerror = (e) => alert(e.target.error.name);
	reader.readAsText(file);
});
// This is the code that will form the actual directory. Three constants are defined
// html_pre_json = the html and javascript that comes before the JSON object containing the directory
// html_post_json = the html and javascript that comes after the JSON object
// I deliberately put the JSON near the end so html_post_json can be super short. Usually, you only
// have to edit html_pre_json. 
// To edit html_pre_json, you need to take the code below, unesecape it to convert it to
// something readable, make your changes, then re-escape it and past it back here. 
// Good luck
// I use this tool to escape/unescape code:https://www.freeformatter.com/javascript-escape.html
const html_pre_json = `<!--
This is the directory html file. It was
auto-generated by another html file.
You should not be editing this code.
Instead, you should use the directory
generator utility to generate this code
and then copy and past it in its
entirety. 
-->
<div id="page-container">
<center>
	<div>
		<input type="text" id="search_field" placeholder="Enter Search Terms">
		<button type="button" style="margin:10px;" id="search_button" onclick="search();">Search Directory<\/button>
	<\/div>
	<div id="results"><\/div>
<\/center>
<\/div>
  
<script type="application\/javascript">
var search_field = document.getElementById("search_field");
search_field.addEventListener("keyup", function(event) {
	if (event.keyCode === 13) {
		document.getElementById("search_button").click();
	}
});
window.addEventListener('load', function() {
	resizeMessage();
});
function resizeMessage() {
	let message = { height: document.body.scrollHeight, width: document.body.scrollWidth};	
	console.log("Sending message... Width: " + message.width + " | Height: " + message.height);
	\/\/ window.top refers to parent window
	window.top.postMessage(message, "*");
}
function search() {
	var search_terms = document.getElementById("search_field").value;
	console.log("Search terms: " + search_terms);
	var results = find_member(search_terms, directory_json, .3)
	console.log("Found " + results.length + " results");
	var results_html = "<table><tbody>\
";
	if (results.length == 0) {
		results_html += "<tr><td><i>No matching members<\/i><\/td><\/tr>\
";
	}
	for (let r of results) {
		results_html += "<tr><td style='padding-bottom: 1em'><strong>" + r.item['Reverse Fullname'] + "<\/strong><br>\
";
		results_html += "<i><strong>" + r.item['Area Name'] + "<\/strong><\/i>\
"; 
		if (r.item['Memb Cat for Web Directory']) {
			results_html += "<br><i>" + r.item['Memb Cat for Web Directory'] + "<\/i>";
		}
		if (r.item['Address1']) { 
			results_html += "<br>\
" + r.item['Address1'];
		}
		if (r.item['Address2']) { 
			results_html += "<br>\
" + r.item['Address2'];
		}
		if (r.item['City'] || r.item['State or Province'] || r.item['Zip Post Code']) {
			results_html += "<br>\
";
			if (r.item['City']) { 
				results_html += r.item['City'] + " ";
			}	
			if (r.item['State or Province']) { 
				results_html += r.item['State or Province'] + " ";
			}
			if (r.item['Zip Post Code']) { 
				results_html += r.item['Zip Post Code'] + " ";
			}
		}
		if (r.item['Country']) { 
			results_html += "<br>\
" + r.item['Country'];
		}
		if (r.item['Home Phone']) { 
			results_html += "<br>\
" + "Home: " + r.item['Home Phone'];
		}
		if (r.item['Work Phone']) { 
			results_html += "<br>\
" + "Work: " + r.item['Work Phone'];
		}
		if (r.item['Cell Phone']) { 
			results_html += "<br>\
" + "Mobile: " + r.item['Cell Phone'];
		}
		if (r.item['Email Address']) {
			results_html += "<br>\
" + "<a target='_blank' href='mailto:" + r.item['Email Address'] + "'>" + r.item['Email Address'] + "<\/a>";
		}
		if (r.item['Expiry Month'] && r.item['Expiry Year']) {
			results_html += "<br>\
" + "Expiration: " + r.item['Expiry Month'] + "\/" + r.item['Expiry Year'];
		}
		results_html += "<\/td><\/tr>\
"
		\/\/const int_score = Math.round(100*(1-r.score));
		\/\/results_html += "<td>" + int_score + "<\/td><\/tr>";0		
	}
	results_html += "<\/table>"
	document.getElementById("results").innerHTML = results_html;
	resizeMessage();
}
function find_member(search_terms, json_data, thresh_limit) {
	const fuse = new Fuse(json_data, {
		includeScore: true,
		keys: ['Reverse Fullname'],
		ignoreLocation: true,
		threshold: 1,
		useExtendedSearch: false
	})
	
	const scored_array = fuse.search(search_terms);
	result_array = [];
	for (let scored_entry of scored_array){
		if (scored_entry.score < thresh_limit) {
			result_array.push(scored_entry)
		}
	}
	result_array.sort((a, b) => {
		return a.score - b.score;
	})
	
	return result_array;
}
